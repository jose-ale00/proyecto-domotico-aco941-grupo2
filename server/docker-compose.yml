services:
  dns:
    image: ubuntu/bind9:latest
    container_name: dns
    restart: unless-stopped
    environment:
      - TZ=America/El_Salvador
    ports:
      - "${IP_SERVIDOR}:53:53/udp"
      - "${IP_SERVIDOR}:53:53/tcp"
    volumes:
      - ./bind/named.conf.options:/etc/bind/named.conf.options:ro

  nodered:
    image: nodered/node-red:latest
    container_name: nodered
    restart: unless-stopped
    environment:
      - TZ=America/El_Salvador
    ports:
      - "1880:1880"
    volumes:
      - nodered_data:/data

  mongodb:
    image: mongo:8.0
    container_name: mongodb
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=${DB_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=domotica
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=domotica
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana

  web:
    image: nginx:latest
    container_name: web
    restart: unless-stopped
    ports:
      - "80:80"

volumes:
  nodered_data:
  mongo_data:
  pg_data:
  grafana_data:
